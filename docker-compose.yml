services:
  proxy:
    image: nginx:1.27-alpine
    container_name: navi_proxy
    ports:
      - "${APP_PORT:-8091}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: navi_frontend
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: navi_backend
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    environment:
      - CORS_ORIGINS=http://localhost:${APP_PORT:-8091}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: navi_db
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d navi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
